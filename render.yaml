# Render.com Deployment Configuration
# GHH Library - Admin Dashboard + API Server

services:
  - type: web
    name: ghh-library
    runtime: node
    region: singapore   # India के सबसे पास
    plan: free
    
    # Build command - Uses npx --yes pnpm to install and build all packages
    buildCommand: npx --yes pnpm install --no-frozen-lockfile && npx --yes pnpm run build
    
    # Start command - Runs API Server + Admin Dashboard
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_DIST_PATH
        value: ./artifacts/admin-dashboard/dist/public
      - key: DATABASE_URL
        sync: false   # Set in Render Dashboard with Supabase Connection String
      - key: CORS_ORIGIN
        value: "*"    # Allow all origins (App + Web)

    # Health check
    healthCheckPath: /api/health
